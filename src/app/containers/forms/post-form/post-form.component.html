<section>
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                What are your insights for today, sir ?
            </mat-card-title>
            <mat-card-subtitle> Surprise the community ! </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="postForm">
                <mat-form-field>
                    <input
                        matInput
                        type="text"
                        placeholder="Post title"
                        formControlName="title"
                    />
                </mat-form-field>
                <mat-form-field>
                    <textarea
                        matInput
                        placeholder="Start writing"
                        cdkTextareaAutosize
                        formControlName="content"
                        rows="14"
                    ></textarea>
                </mat-form-field>
                <div class="post-form-buttons">
                    <button
                        mat-flat-button
                        color="primary"
                        [disabled]="postForm.invalid"
                        (click)="onSavePostAsDraftBtnClick()"
                    >
                        Save post as draft
                    </button>
                    <button
                        mat-flat-button
                        color="primary"
                        [disabled]="postForm.invalid"
                        (click)="onPublishPostBtnClick()"
                    >
                        Publish post
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</section>
