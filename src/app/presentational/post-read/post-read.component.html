<section>
    <ng-container *ngIf="post$ | async as post">
        <mat-card id="post">
            <mat-card-header>
                <mat-card-title>{{ post.title }}</mat-card-title>
                <mat-card-subtitle>
                    By {{ post.createdBy }} on
                    {{
                        post.publishedOn | date : "mm/dd/yyyy"
                    }}</mat-card-subtitle
                >
            </mat-card-header>
            <mat-card-content>
                {{ post.content }}
            </mat-card-content>
        </mat-card>
    </ng-container>
</section>
